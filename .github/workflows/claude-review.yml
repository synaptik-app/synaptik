name: Claude Review

# Reviews a PR once, when it is opened or marked ready. Not on every push: the
# runs share the maintainer's Claude subscription limits. For another pass,
# comment `@claude review again` and claude.yml picks it up.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    # Branches in this repository only, never forks: only people with write
    # access can push here. Drafts wait until they are marked ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write # the action authenticates as the Claude GitHub App
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs Claude opens from an `@claude` issue run as the Claude app.
          allowed_bots: claude
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md, then follow REVIEW.md:
            what to look for, what to leave alone, and how to report.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
