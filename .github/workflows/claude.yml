name: Claude Code

# `@claude` in an issue or PR comment asks Claude to work on it: answer, review,
# or open a PR. Setup (once): the Claude GitHub App on the repository and the
# CLAUDE_CODE_OAUTH_TOKEN secret — `/install-github-app` in Claude Code does both.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only on the maintainer's mention: no runner starts for anyone else's
    # comment. The action also refuses users without write access; this keeps
    # holding if a collaborator is added later.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'mgundogan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run per issue or PR, so a double comment does not fan out.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action authenticates as the Claude GitHub App
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # No github_token: commits made with the default token do not trigger
      # workflows, so CI would never run on Claude's pushes.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 25
