# A bug report or a feature/idea; questions go to Discussions, vulnerabilities
# to private reporting. Blank issues are off for people picking from the list.
blank_issues_enabled: false
contact_links:
  - name: Question or discussion
    url: https://github.com/synaptik-app/synaptik/discussions
    about: How something works, or a design to talk through.
  - name: Security vulnerability
    url: https://github.com/synaptik-app/synaptik/security/advisories/new
    about: Report privately — see SECURITY.md.
