name: Design question or decision
description: Something to decide or design — record the options and what is known
title: "Design: "
labels: [enhancement]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
      description: What needs deciding, and why now.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each option with what it costs. A table works well.
  - type: textarea
    id: known
    attributes:
      label: What is known
      description: Findings, tests, constraints — link SPEC sections, DECISIONS entries, issues.
  - type: textarea
    id: lean
    attributes:
      label: Leaning
      description: A recommendation, if there is one. The decision goes into docs/DECISIONS.md once made.
