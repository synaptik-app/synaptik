name: Bug report
description: Synaptik does something wrong, draws something wrong, or doesn't load
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please reproduce it on a made-up prompt rather than pasting private or work content.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The steps, and the keys you pressed.
      placeholder: |
        1. Asked Claude for a plan with a nested list
        2. /synaptik, then ↑ three times
        3. pressed a — …
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
      placeholder: 2.1.304
    validations:
      required: true
  - type: input
    id: synaptik
    attributes:
      label: Synaptik version
      description: As `/plugin` lists it.
      placeholder: 0.1.0-alpha.3
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - The marketplace (synaptik@synaptik-app)
        - A release zip (--plugin-dir, or unzipped into the skills folder)
        - A clone (--plugin-dir)
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - Fullscreen
        - Classic
        - Not sure
  - type: input
    id: environment
    attributes:
      label: OS and terminal
      description: And tmux, SSH, an IDE's terminal, other mods loaded — whatever applies.
      placeholder: macOS 15, iTerm2 · Windows 11, Windows Terminal, PowerShell 7 · Ubuntu 24.04, GNOME Terminal
  - type: textarea
    id: log
    attributes:
      label: /synaptik log
      description: The output of `/synaptik log` right after it happened, if you have it.
      render: text
